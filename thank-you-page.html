<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Oluwanii Signature Cuts</title>
  <meta name="robots" content="noindex" />
  <meta
    name="description"
    content="Your appointment request has been received by Oluwanii Signature Cuts."
  />
  <meta name="theme-color" content="#0b0b0d" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%88%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="Oluwanii Signature Cuts — home">
        <span class="brand-icon" aria-hidden="true">💈</span>
        <span class="brand-text">OLUWANII <em>Signature Cuts</em></span>
      </a>
      <a href="index.html" class="btn btn-gold nav-cta">Home</a>
    </nav>
  </header>

  <main class="thanks-wrap">
    <div class="thanks-card">
      <div class="thanks-icon" aria-hidden="true">✓</div>
      <h1 class="thanks-title" id="thanksTitle">Thank You!</h1>
      <p class="thanks-sub" id="thanksSub">
        Your appointment request has been received. We’ll get back to you shortly
        to confirm your booking.
      </p>

      <dl class="booking-summary" id="bookingSummary" hidden>
        <div class="summary-row">
          <dt class="summary-label">Service</dt>
          <dd class="summary-value" id="bookingService">—</dd>
        </div>
        <div class="summary-row">
          <dt class="summary-label">Date</dt>
          <dd class="summary-value" id="bookingDate">—</dd>
        </div>
        <div class="summary-row">
          <dt class="summary-label">Time</dt>
          <dd class="summary-value" id="bookingTime">—</dd>
        </div>
        <div class="summary-row">
          <dt class="summary-label">Phone</dt>
          <dd class="summary-value" id="bookingPhone">—</dd>
        </div>
      </dl>

      <p class="thanks-sub" id="confirmNote">
        For an immediate response, reach us on WhatsApp — we usually reply within minutes.
      </p>

      <div class="thanks-actions">
        <a
          class="btn btn-wa btn-lg"
          href="https://wa.me/2347025113434"
          target="_blank"
          rel="noopener"
        >
          💬 Chat on WhatsApp
        </a>
        <a class="btn btn-outline btn-lg" href="index.html">Back to Home</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el && value) el.textContent = value;
      }

      var booking = null;
      try {
        booking = JSON.parse(
          localStorage.getItem("oluwaniicutz_last_booking") || "null"
        );
      } catch (err) {
        booking = null;
      }

      if (booking && booking.name) {
        var firstName = String(booking.name).split(/\s+/)[0];
        setText("thanksTitle", "Thank You, " + firstName + "!");
        setText(
          "thanksSub",
          "Your request is in — we’ll confirm your slot by phone or WhatsApp shortly."
        );
      }

      if (booking && (booking.service || booking.date || booking.time || booking.phone)) {
        document.getElementById("bookingSummary").hidden = false;
        setText("bookingService", booking.service || "");

        if (booking.date) {
          var parts = String(booking.date).split("-");
          if (parts.length === 3) {
            var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            setText(
              "bookingDate",
              d.toLocaleDateString("en-GB", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
              })
            );
          }
        }

        if (booking.time) {
          var t = String(booking.time).split(":");
          if (t.length === 2) {
            var h = Number(t[0]);
            var min = t[1];
            var h12 = h % 12 === 0 ? 12 : h % 12;
            setText("bookingTime", h12 + ":" + min + " " + (h >= 12 ? "pm" : "am"));
          }
        }

        setText("bookingPhone", booking.phone || "");
      }
    })();
  </script>
</body>
</html>
